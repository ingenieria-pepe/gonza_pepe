<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Proyección a fin de año — Almar</title>
<style>
:root{
  --bg:#faf9f5; --card:#fffefb; --ink:#141413; --muted:#6b6a63; --faint:#c3c2b7;
  --border:rgba(11,11,11,0.10); --good:#006300; --bad:#c0392b;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --band:rgba(42,120,214,.13); --real:rgba(27,175,122,.13);
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#1f1e1d; --card:#262624; --ink:#f5f4ee; --muted:#a3a29b; --faint:#56554f;
         --border:rgba(255,255,255,0.10); --good:#0ca30c; --bad:#e05c4a;
         --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
         --band:rgba(57,135,229,.20); --real:rgba(25,158,112,.20); }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:1060px;margin:0 auto;padding:26px 18px 60px}
header h1{font-size:23px;margin:0 0 6px}
.sub{color:var(--muted);font-size:13.5px;margin:0 0 4px}
.meta{color:var(--faint);font-size:12px;margin:10px 0 0}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px 18px 20px;margin:20px 0}
.card h2{font-size:17px;margin:0 0 4px}
.card .sub{margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:12px;margin:18px 0}
.tile{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:13px 14px}
.tile .lab{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.tile .val{font-size:25px;font-weight:650;margin:3px 0 1px;line-height:1.1}
.tile .u{font-size:12px;color:var(--muted);font-weight:400;margin-left:3px}
.tile .dl{font-size:12px;color:var(--muted)}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:540px}
th,td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;font-weight:600}
tbody tr.real{background:var(--real)}
tbody tr.tot{border-top:2px solid var(--border);font-weight:650}
td.pos{color:var(--good)} td.neg{color:var(--bad)} td.nil{color:var(--faint)}
.tag{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:20px;
  background:rgba(120,120,120,.16);color:var(--muted);margin-left:6px;vertical-align:1px}
.tag.r{background:rgba(27,175,122,.22);color:var(--good)}
.conf{display:inline-block;height:6px;border-radius:3px;background:var(--s1);vertical-align:middle}
.confbg{display:inline-block;width:70px;height:6px;border-radius:3px;background:var(--border);vertical-align:middle;overflow:hidden}
.plot{width:100%;overflow-x:auto}
svg{display:block;max-width:100%;height:auto}
.note{font-size:12.5px;color:var(--muted);margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.note p{margin:0 0 8px} .note p:last-child{margin:0}
.flag{border-left:3px solid var(--s1);padding-left:11px;border-top:0;margin-top:14px}
.warn{border-left-color:var(--bad)}
.legend{list-style:none;display:flex;flex-wrap:wrap;gap:14px;padding:0;margin:0 0 10px;font-size:12.5px;color:var(--muted)}
.legend li{display:flex;align-items:center;gap:6px}
.swatch{width:11px;height:11px;border-radius:3px;display:inline-block}
code{background:rgba(120,120,120,.13);padding:1px 5px;border-radius:4px;font-size:12px}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>🔭 Proyección a fin de año</h1>
  <p class="sub" id="subHead"></p>
  <p class="meta" id="meta"></p>
</header>

<div class="kpis" id="kpis"></div>

<div class="note flag warn" style="margin:0 0 20px">
  <p id="avisoConfianza"></p>
</div>

<section class="card">
  <h2 id="h2precio">Precio Cepea</h2>
  <p class="sub" id="subPrecio"></p>
  <ul class="legend" id="lgPrecio"></ul>
  <div class="plot" id="pPrecio"></div>
  <div class="tblwrap" style="margin-top:14px"><table id="tblPrecio"></table></div>
  <div class="note flag" id="notaPrecio"></div>
</section>

<section class="card">
  <h2 id="h2vol">Volumen del mercado por origen</h2>
  <p class="sub" id="subVol"></p>
  <div class="tblwrap"><table id="tblVol"></table></div>
  <div class="note flag" id="notaVol"></div>
</section>

<section class="card">
  <h2>Valor del mercado</h2>
  <p class="sub" id="subValor"></p>
  <div class="tblwrap"><table id="tblValor"></table></div>
</section>

<section class="card">
  <h2 id="h2almar">Almar, si mantiene participación</h2>
  <p class="sub" id="subAlmar"></p>
  <div class="kpis" id="kpiAlmar" style="margin-top:0"></div>
  <div class="tblwrap"><table id="tblAlmar"></table></div>
  <div class="note flag" id="notaAlmar"></div>
</section>

<div class="note flag warn">
  <p><strong>Qué NO contempla esta proyección.</strong> <span id="limitaciones"></span></p>
</div>

</div>

<script id="datosProy" type="application/json">/*__PROYECCION_JSON__*/{"generado":"2026-09-04 19:00","anio":2026,"base":{"ultima_semana":"2026-09-04","ultimo_precio":0.91,"desvio":0.541,"phi":0.818},"supuestos":{"tc":5.2,"kgCaja":22,"servCaja":16},"mesesVolumen":[9,10,11,12],"precio":[{"mes":9,"estado":"proyectado","baseline":1.78,"factor":0.693,"semanas":2,"valor":1.23,"caja":43,"usdCaja":8.3,"hist":{"2023":1.3,"2024":2.2,"2025":2.06}},{"mes":10,"estado":"proyectado","baseline":2.06,"factor":0.862,"semanas":6,"valor":1.78,"caja":55,"usdCaja":10.59,"hist":{"2023":1.39,"2024":2.34,"2025":2.38}},{"mes":11,"estado":"proyectado","baseline":1.68,"factor":0.938,"semanas":10,"valor":1.58,"caja":51,"usdCaja":9.75,"hist":{"2023":1.81,"2024":1.2,"2025":1.99}},{"mes":12,"estado":"proyectado","baseline":1.53,"factor":0.977,"semanas":15,"valor":1.5,"caja":49,"usdCaja":9.4,"hist":{"2023":1.25,"2024":1.38,"2025":1.96}}],"volumen":[{"origen":"Brasil","actual":1698,"factores":[1.179,1.045],"central":1888,"lo":1774,"hi":2003,"fobKg":0.525,"usdMes":991320,"nota":"factor estacional de 2024/2025"},{"origen":"Ecuador","actual":1245,"factores":[1.257,1.748],"central":1871,"lo":1564,"hi":2177,"fobKg":1.007,"usdMes":1883645,"nota":"factor estacional de 2024/2025"},{"origen":"Paraguay","actual":931,"factores":[0.878,0.638],"central":706,"lo":594,"hi":818,"fobKg":0.52,"usdMes":366973,"nota":"factor estacional de 2024/2025"},{"origen":"Bolivia","actual":206,"factores":[],"central":411,"lo":246,"hi":575,"fobKg":0.611,"usdMes":250921,"nota":"sin historia comparable — banda +-40% declarada"}],"volTotal":{"central":4875,"lo":4178,"hi":5572,"usdMes":3492859,"hist":[{"anio":2024,"t":4832},{"anio":2025,"t":5386}]},"almar":{"share":0.4958,"tMes":2417,"tPeriodo":9669,"cajasMes":109876,"costo":[{"mes":9,"caja":43,"cajas":42552,"brl":1829715,"usd":351868},{"mes":10,"caja":55,"cajas":42552,"brl":2340333,"usd":450064},{"mes":11,"caja":51,"cajas":42552,"brl":2170127,"usd":417332},{"mes":12,"caja":49,"cajas":42552,"brl":2085024,"usd":400966}]}}/*__END_PROYECCION__*/</script>

<script>
(function () {
  "use strict";
  // Los marcadores van como regex ESCAPADOS: su texto literal no aparece en el
  // codigo, asi la inyeccion del script no puede matchearlo aca dentro.
  var D = JSON.parse(document.getElementById('datosProy').textContent
    .replace(/\/\*__PROYECCION_JSON__\*\//, '').replace(/\/\*__END_PROYECCION__\*\//, ''));

  var MES = ['ene','feb','mar','abr','may','jun','jul','ago','set','oct','nov','dic'];
  function el(t,c){var e=document.createElement(t); if(c) e.className=c; return e;}
  function svgEl(t,a){var e=document.createElementNS('http://www.w3.org/2000/svg',t);
    for(var k in a) e.setAttribute(k,a[k]); return e;}
  function txt(id,s){var n=document.getElementById(id); if(n) n.textContent=s;}
  function fmt(v,d){ if(v===null||v===undefined||isNaN(v)) return '—';
    return Number(v).toLocaleString('es-UY',{minimumFractionDigits:d||0,maximumFractionDigits:d||0}); }
  function tile(cont,lab,val,u,dl){
    var c=el('div','tile');
    var l=el('div','lab'); l.textContent=lab; c.appendChild(l);
    var v=el('div','val'); v.textContent=val;
    if(u){var s=el('span','u'); s.textContent=u; v.appendChild(s);}
    c.appendChild(v);
    var d=el('div','dl'); d.textContent=dl; c.appendChild(d);
    cont.appendChild(c);
  }
  function tabla(id,cols,filas){
    var t=document.getElementById(id); if(!t) return; t.innerHTML='';
    var th=el('thead'),tr=el('tr');
    cols.forEach(function(c){var h=el('th'); h.textContent=c; tr.appendChild(h);});
    th.appendChild(tr); t.appendChild(th);
    var tb=el('tbody');
    filas.forEach(function(f){
      var r=el('tr'); if(f.cls) r.className=f.cls;
      f.cells.forEach(function(c){
        var td=el('td');
        if(c&&typeof c==='object'&&c.html){ td.innerHTML=c.html; if(c.cls) td.className=c.cls; }
        else if(c&&typeof c==='object'){ td.textContent=c.v; if(c.cls) td.className=c.cls; }
        else td.textContent=c;
        r.appendChild(td);
      });
      tb.appendChild(r);
    });
    t.appendChild(tb);
  }

  if(!D.precio || !D.precio.length){
    txt('meta','Sin datos todavía. Corré actualizar_precios.ps1.');
    return;
  }

  var proyec = D.precio.filter(function(p){return p.estado==='proyectado';});
  var reales = D.precio.filter(function(p){return p.estado==='real';});
  var mesesVol = D.mesesVolumen || [];
  var rangoTxt = proyec.length
    ? MES[proyec[0].mes-1] + '–' + MES[proyec[proyec.length-1].mes-1] + ' ' + D.anio
    : 'sin meses por proyectar';

  txt('subHead','Precio Cepea y volumen del mercado uruguayo hasta diciembre. Se recalcula en cada corrida del script.');
  txt('meta','Base: semana del ' + D.base.ultima_semana + ' a R$ ' + fmt(D.base.ultimo_precio,2) +
    '/kg · desvío ' + fmt(D.base.desvio,3) + ' de la norma · phi ' + fmt(D.base.phi,3) +
    ' · generado ' + D.generado);

  // ---------- KPIs ----------
  (function(){
    var k=document.getElementById('kpis');
    if(proyec.length){
      var pMax=proyec.reduce(function(a,b){return b.valor>a.valor?b:a;});
      tile(k,'Pico proyectado','R$ '+fmt(pMax.valor,2),'/kg',MES[pMax.mes-1]+' · R$ '+fmt(pMax.caja)+'/caja');
      var pUlt=proyec[proyec.length-1];
      tile(k,'Cierre de año','R$ '+fmt(pUlt.valor,2),'/kg',MES[pUlt.mes-1]+' · R$ '+fmt(pUlt.caja)+'/caja');
    }
    if(D.volTotal.central){
      tile(k,'Mercado '+rangoTxt,fmt(D.volTotal.central),'t/mes',
        'rango '+fmt(D.volTotal.lo)+'–'+fmt(D.volTotal.hi));
      tile(k,'Valor del mercado','USD '+fmt(D.volTotal.usdMes/1e6,2),'M/mes',
        'USD '+fmt(D.volTotal.usdMes*mesesVol.length/1e6,1)+' M en '+mesesVol.length+' meses');
    }
  })();

  // ---------- aviso de confianza ----------
  (function(){
    var lejano = proyec.filter(function(p){return p.factor!==null && p.factor>0.95;});
    var s = 'La confianza cae rápido con el horizonte. El precio se proyecta anclando el desvío actual ' +
      '(' + fmt(D.base.desvio,3) + ' de la norma) y dejándolo revertir con phi=' + fmt(D.base.phi,3) + ' por semana. ';
    if(lejano.length){
      s += 'Para ' + lejano.map(function(p){return MES[p.mes-1];}).join(', ') +
        ' el ancla ya prácticamente se lavó (factor >0,95): esos meses son el promedio estacional, no un pronóstico. ' +
        'El backtest mostró que más allá de 4 semanas el ancla no aporta.';
    } else {
      s += 'Todos los meses proyectados están dentro del horizonte donde el ancla todavía pesa.';
    }
    txt('avisoConfianza', s);
  })();

  // ---------- chart precio ----------
  (function(){
    var lg=document.getElementById('lgPrecio');
    [['Proyectado','var(--s1)'],['Real','var(--s3)'],['Rango histórico','var(--band)']].forEach(function(x){
      var li=el('li'); var sw=el('span','swatch'); sw.style.background=x[1];
      li.appendChild(sw); li.appendChild(document.createTextNode(x[0])); lg.appendChild(li);
    });

    var W=1000,H=300,M={t:18,r:18,b:34,l:52};
    var iw=W-M.l-M.r, ih=H-M.t-M.b;
    var vmax=0;
    D.precio.forEach(function(p){
      if(p.valor>vmax) vmax=p.valor;
      for(var y in p.hist){ if(p.hist[y]>vmax) vmax=p.hist[y]; }
    });
    vmax=Math.ceil(vmax*2)/2+0.25;
    var n=D.precio.length;
    var x=function(i){return M.l+(n===1?iw/2:(i/(n-1))*iw);};
    var y=function(v){return M.t+ih-(v/vmax)*ih;};
    var svg=svgEl('svg',{viewBox:'0 0 '+W+' '+H,role:'img','aria-label':'Precio Cepea proyectado'});

    for(var g=0;g<=4;g++){
      var vy=vmax*g/4;
      svg.appendChild(svgEl('line',{x1:M.l,x2:W-M.r,y1:y(vy),y2:y(vy),stroke:'var(--border)','stroke-width':1}));
      var tl=svgEl('text',{x:M.l-8,y:y(vy)+4,'text-anchor':'end','font-size':11,fill:'var(--muted)'});
      tl.textContent=fmt(vy,2); svg.appendChild(tl);
    }
    // banda min-max historica
    var top='',bot='';
    D.precio.forEach(function(p,i){
      var vs=[]; for(var yy in p.hist) vs.push(p.hist[yy]);
      if(!vs.length) return;
      var mn=Math.min.apply(null,vs), mx=Math.max.apply(null,vs);
      top+=(top?' L':'M')+x(i)+' '+y(mx);
      bot=' L'+x(i)+' '+y(mn)+bot;
    });
    if(top) svg.appendChild(svgEl('path',{d:top+bot+' Z',fill:'var(--band)',stroke:'none'}));

    var dR='',dP='';
    D.precio.forEach(function(p,i){
      if(p.estado==='real') dR+=(dR?' L':'M')+x(i)+' '+y(p.valor);
    });
    D.precio.forEach(function(p,i){
      if(p.estado==='proyectado'||(i>0&&D.precio[i-1].estado==='real'&&p.estado==='proyectado'))
        dP+=(dP?' L':'M')+x(i)+' '+y(p.valor);
    });
    // unir el ultimo real con el primer proyectado
    var iR=-1,iP=-1;
    D.precio.forEach(function(p,i){ if(p.estado==='real') iR=i; });
    D.precio.forEach(function(p,i){ if(iP<0&&p.estado==='proyectado') iP=i; });
    if(iR>=0&&iP===iR+1){
      svg.appendChild(svgEl('path',{d:'M'+x(iR)+' '+y(D.precio[iR].valor)+' L'+x(iP)+' '+y(D.precio[iP].valor),
        stroke:'var(--s1)','stroke-width':2.4,fill:'none','stroke-dasharray':'5 4'}));
    }
    if(dR) svg.appendChild(svgEl('path',{d:dR,fill:'none',stroke:'var(--s3)','stroke-width':2.6,'stroke-linejoin':'round'}));
    if(dP) svg.appendChild(svgEl('path',{d:dP,fill:'none',stroke:'var(--s1)','stroke-width':2.6,'stroke-dasharray':'5 4','stroke-linejoin':'round'}));

    D.precio.forEach(function(p,i){
      svg.appendChild(svgEl('circle',{cx:x(i),cy:y(p.valor),r:3.5,
        fill:p.estado==='real'?'var(--s3)':'var(--s1)'}));
      var t=svgEl('text',{x:x(i),y:H-12,'text-anchor':'middle','font-size':11,fill:'var(--muted)'});
      t.textContent=MES[p.mes-1]; svg.appendChild(t);
    });
    document.getElementById('pPrecio').appendChild(svg);
  })();

  // ---------- tabla precio ----------
  (function(){
    var anios=[]; D.precio.forEach(function(p){ for(var y in p.hist) if(anios.indexOf(y)<0) anios.push(y); });
    anios.sort();
    var filas=D.precio.map(function(p){
      var conf = p.factor===null ? '' :
        '<span class="confbg"><span class="conf" style="width:'+Math.round(Math.max(0,Math.min(1,(1-p.factor)/0.4))*70)+'px"></span></span>';
      var cells=[ MES[p.mes-1]+(p.estado==='real'?'<span class="tag r">real</span>':'') ];
      cells[0]={html:cells[0]};
      cells.push({v:'R$ '+fmt(p.valor,2)});
      cells.push(fmt(p.caja));
      cells.push(fmt(p.usdCaja,2));
      cells.push(p.estado==='real'?'—':fmt(p.baseline,2));
      cells.push(p.factor===null?'—':fmt(p.factor,3));
      anios.forEach(function(y){ cells.push(p.hist[y]!==undefined?fmt(p.hist[y],2):{v:'—',cls:'nil'}); });
      cells.push({html:conf});
      return {cls:p.estado==='real'?'real':'',cells:cells};
    });
    tabla('tblPrecio',
      ['Mes','R$/kg','R$/caja','USD/caja','baseline','factor'].concat(anios).concat(['peso del ancla']),
      filas);
    txt('subPrecio','R$/caja = R$/kg × '+D.supuestos.kgCaja+' + R$ '+D.supuestos.servCaja+
      ' de servicios. USD a '+fmt(D.supuestos.tc,2)+'. La barra final muestra cuánto pesa el precio actual frente al promedio estacional.');
    txt('h2precio','Precio Cepea — '+rangoTxt);

    var n=document.getElementById('notaPrecio'); var p=el('p');
    var anchos=D.precio.filter(function(x){ var vs=[]; for(var y in x.hist) vs.push(x.hist[y]);
      return vs.length>1 && (Math.max.apply(null,vs)/Math.min.apply(null,vs))>1.5; });
    if(anchos.length){
      p.appendChild(document.createTextNode('Ojo con la dispersión histórica: en '+
        anchos.map(function(x){return MES[x.mes-1];}).join(', ')+
        ' el rango entre años supera el 50%. El número central es una referencia, no una apuesta.'));
      n.appendChild(p);
    }
  })();

  // ---------- volumen ----------
  (function(){
    if(!D.volumen.length){ txt('subVol','Sin meses por proyectar: el año ya está completo.'); return; }
    txt('h2vol','Volumen del mercado — '+rangoTxt);
    txt('subVol','Nivel actual de cada origen × su factor estacional de años previos. El rango sale del mínimo y máximo de esos factores, no es un intervalo estadístico.');
    var filas=D.volumen.map(function(v){
      var d=v.actual?((v.central/v.actual-1)*100):null;
      return {cells:[v.origen,fmt(v.actual),
        v.factores.length?v.factores.map(function(f){return fmt(f,3);}).join(' / '):{v:'—',cls:'nil'},
        {v:fmt(v.central),cls:''},
        fmt(v.lo)+'–'+fmt(v.hi),
        d===null?'—':{v:(d>0?'+':'')+fmt(d,0)+'%',cls:d>=0?'pos':'neg'}]};
    });
    filas.push({cls:'tot',cells:['TOTAL','','',fmt(D.volTotal.central),fmt(D.volTotal.lo)+'–'+fmt(D.volTotal.hi),'']});
    tabla('tblVol',['Origen','actual (t/mes)','factores','proyectado','rango','var'],filas);

    var n=document.getElementById('notaVol');
    if(D.volTotal.hist && D.volTotal.hist.length){
      var p=el('p');
      var hs=D.volTotal.hist.map(function(h){return h.anio+': '+fmt(h.t);}).join(' · ');
      var prom=D.volTotal.hist.reduce(function(a,h){return a+h.t;},0)/D.volTotal.hist.length;
      var dif=(D.volTotal.central/prom-1)*100;
      p.appendChild(document.createTextNode('Mismo período en años previos — '+hs+
        ' t/mes. La proyección queda '+(dif>=0?'+':'')+fmt(dif,1)+'% respecto de ese promedio.'));
      n.appendChild(p);
    }
    var flojos=D.volumen.filter(function(v){return v.factores.length<2;});
    if(flojos.length){
      var p2=el('p');
      p2.appendChild(document.createTextNode('Menos confiables: '+
        flojos.map(function(v){return v.origen+' ('+v.nota+')';}).join('; ')+'.'));
      n.appendChild(p2);
    }
  })();

  // ---------- valor ----------
  (function(){
    if(!D.volumen.length) return;
    var nm=mesesVol.length;
    var filas=D.volumen.map(function(v){
      return {cells:[v.origen,fmt(v.central),fmt(v.fobKg,3),
        'USD '+fmt(v.usdMes),'USD '+fmt(v.usdMes*nm),
        fmt(v.usdMes/D.volTotal.usdMes*100,1)+'%']};
    });
    filas.push({cls:'tot',cells:['TOTAL',fmt(D.volTotal.central),'',
      'USD '+fmt(D.volTotal.usdMes),'USD '+fmt(D.volTotal.usdMes*nm),'100%']});
    tabla('tblValor',['Origen','t/mes','USD/kg','USD/mes','USD '+nm+' meses','% del valor'],filas);
    var mayor=D.volumen.slice().sort(function(a,b){return b.usdMes-a.usdMes;})[0];
    txt('subValor','Valorizado al USD/kg declarado de cada origen. '+mayor.origen+
      ' concentra el '+fmt(mayor.usdMes/D.volTotal.usdMes*100,0)+'% del valor con el '+
      fmt(mayor.central/D.volTotal.central*100,0)+'% del volumen.');
  })();

  // ---------- Almar ----------
  (function(){
    if(!D.almar.share){ return; }
    var nm=mesesVol.length;
    txt('h2almar','Almar hasta fin de año, si mantiene participación');
    txt('subAlmar','Proyección de tu volumen y desembolso asumiendo que sostenés el '+
      fmt(D.almar.share*100,1)+'% del mercado que tenés hoy.');
    var k=document.getElementById('kpiAlmar');
    tile(k,'Volumen',fmt(D.almar.tMes),'t/mes',fmt(D.almar.tPeriodo)+' t en '+nm+' meses');
    tile(k,'Cajas de '+D.supuestos.kgCaja+' kg',fmt(D.almar.cajasMes),'/mes',
      fmt(D.almar.cajasMes*nm)+' cajas en el período');
    if(D.almar.costo.length){
      var tot=D.almar.costo.reduce(function(a,c){return a+c.usd;},0);
      tile(k,'Desembolso Brasil','USD '+fmt(tot/1e6,2),'M',
        'los '+D.almar.costo.length+' meses proyectados');
    }
    var filas=D.almar.costo.map(function(c){
      return {cells:[MES[c.mes-1],fmt(c.caja),fmt(c.cajas),'R$ '+fmt(c.brl),'USD '+fmt(c.usd)]};
    });
    if(filas.length){
      var tb=D.almar.costo.reduce(function(a,c){return a+c.brl;},0);
      var tu=D.almar.costo.reduce(function(a,c){return a+c.usd;},0);
      filas.push({cls:'tot',cells:['TOTAL','','','R$ '+fmt(tb),'USD '+fmt(tu)]});
    }
    tabla('tblAlmar',['Mes','R$/caja','cajas BR','desembolso R$','desembolso USD'],filas);
    var n=document.getElementById('notaAlmar'); var p=el('p');
    p.appendChild(document.createTextNode('El desembolso es sólo la fruta de Brasil al precio Cepea proyectado más servicios. No incluye flete internacional, despacho ni los otros orígenes.'));
    n.appendChild(p);
  })();

  // ---------- limitaciones ----------
  (function(){
    var l = 'La calidad de la fruta no está en el modelo: la proyección de volumen asume que cada origen repite su estacionalidad normal. ' +
      'Si el problema de calidad de Brasil persiste, la recuperación proyectada no ocurre y los otros orígenes tienen que cubrir más. ' +
      'Tampoco contempla tipo de cambio (fijo en ' + fmt(D.supuestos.tc,2) + '), cambios de proveedor, ni decisiones comerciales tuyas o de la competencia. ' +
      'Los rangos de volumen son la horquilla entre los factores estacionales de años previos, no intervalos de confianza estadísticos.';
    txt('limitaciones', l);
  })();
})();
</script>
</body>
